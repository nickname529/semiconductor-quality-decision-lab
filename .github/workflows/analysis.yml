name: Reproduce quality decision analysis
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: ruff check src scripts tests
      - run: ruff format --check src scripts tests
      - run: python scripts/run_analysis.py --download --output results/ci
      - run: python scripts/verify_reproduction.py --actual results/ci
      - run: python -m pytest -q
